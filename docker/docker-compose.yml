services:
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: []
    command: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      for b in lakehouse bronze silver gold; do
        mc mb --ignore-existing local/$$b;
      done;
      echo 'Buckets ready: lakehouse, bronze, silver, gold'
      "

  spark:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.0
    container_name: lakehouse-spark
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8889:8888"
      - "4040:4040"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - ../:/workspace
      - ./spark-entrypoint.sh:/opt/spark-entrypoint.sh
      - ivy-cache:/home/jovyan/.ivy2
    working_dir: /workspace
    entrypoint: ["/bin/bash", "/opt/spark-entrypoint.sh"]

volumes:
  minio-data:
  ivy-cache: